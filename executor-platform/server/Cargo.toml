[package]
name = "ursi-executor-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "io-util", "signal"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
