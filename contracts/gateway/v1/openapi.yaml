openapi: 3.1.0
info:
  title: URSI Gateway 控制面
  version: 1.0.0
  description: 异步操作、幂等重放和 WebSocket 帧语义见随附的 README.md。
security: [{bearer: []}]
paths:
  /healthz:
    get:
      summary: 查询 HTTP 进程健康状态
      security: []
      responses:
        '200':
          description: 进程在线
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: {status: {const: ok}}
  /api/v1/capabilities:
    get:
      summary: 查询已启用的驱动与传输能力
      responses:
        '200':
          description: Gateway 能力
          content:
            application/json:
              schema:
                type: object
                required: [driver, capabilities, tunnel_enabled]
                properties:
                  driver: {type: string}
                  tunnel_enabled: {type: boolean}
                  capabilities:
                    type: object
                    required: [rebuild_preserve_data, rebuild_destroy_data]
                    properties:
                      rebuild_preserve_data: {type: boolean}
                      rebuild_destroy_data: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes:
    post:
      summary: 创建或按幂等键取回沙箱
      parameters:
        - name: Idempotency-Key
          in: header
          description: 单个非空白键，最多 256 字节。重试时沿用原键与规格。
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SandboxSpec'}
            examples: {create: {externalValue: examples/create.json}}
      responses:
        '202':
          description: 操作已持久化；幂等重放返回当前记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
              examples: {accepted: {externalValue: examples/accepted.json}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
    get:
      summary: 列出沙箱
      responses:
        '200':
          description: 当前资源记录
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes: {type: array, items: {$ref: '#/components/schemas/Sandbox'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      summary: 查询单个沙箱
      responses:
        '200':
          description: 当前资源记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
              examples: {running: {externalValue: examples/running.json}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: 请求删除沙箱
      responses:
        '202':
          description: 已记录删除意图，后续查询 404 才确认完成
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
              examples: {deleting: {externalValue: examples/deleting.json}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/start:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      summary: 请求启动沙箱
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/stop:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      summary: 请求停止沙箱
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/rebuild:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      summary: 请求重建沙箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preserve_data]
              properties: {preserve_data: {type: boolean}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/logs:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      summary: 读取有大小上限的日志尾部
      parameters:
        - name: tail
          in: query
          schema: {type: integer, minimum: 1, maximum: 5000, default: 5000}
      responses:
        '200':
          description: 日志内容
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties: {content: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/endpoints:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      summary: 读取上次对账的端点快照
      responses:
        '200':
          description: 声明端点与可拨号地址
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sandboxes/{id}/connect/{endpoint}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      summary: 为声明的端点升级到 TCP over WebSocket
      description: 使用标准 WebSocket 握手，子协议列表须含 ursi-tcp-v1，不允许 Origin 或 query。
      parameters:
        - name: endpoint
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Name'}
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: {type: string, example: ursi-tcp-v1}
      responses:
        '101':
          description: 升级成功，后续帧语义见 README.md
          headers:
            Sec-WebSocket-Protocol: {schema: {const: ursi-tcp-v1}}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
  responses:
    Accepted:
      description: 操作已受理，返回当前记录
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Sandbox'}
    Error:
      description: 400 invalid、401 unauthorized、404 not_found、405 method_not_allowed、409 conflict、500 internal、501 unsupported、502 bad_gateway 或 503 unavailable。message 为安全摘要。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: 请求参数或 JSON 非法（invalid）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 缺少或无效 Bearer 身份
      headers:
        WWW-Authenticate: {schema: {const: Bearer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples: {unauthorized: {externalValue: examples/unauthorized.json}}
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples: {not_found: {externalValue: examples/not_found.json}}
    Conflict:
      description: 幂等键或操作冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples: {conflict: {externalValue: examples/conflict.json}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    Name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    Port: {type: integer, minimum: 1, maximum: 65535}
    Visibility: {enum: [public, internal]}
    PortSpec:
      type: object
      additionalProperties: false
      required: [name, port, visibility]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        port: {$ref: '#/components/schemas/Port'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        ready: {type: boolean, default: false}
    Bundle:
      type: object
      additionalProperties: false
      required: [url, sha256, min_image_level]
      properties:
        url: {type: string, format: uri, pattern: '^https?://[^@]+$'}
        sha256: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        min_image_level: {type: integer, minimum: 0, maximum: 4294967295}
    SandboxSpec:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image: {type: string, pattern: '^[^-\s]\S*$'}
        command: {type: array, items: {type: string}, maxItems: 128, default: []}
        ports: {type: array, items: {$ref: '#/components/schemas/PortSpec'}, maxItems: 32, default: []}
        labels: {type: object, additionalProperties: {type: string}, maxProperties: 64, default: {}}
        memory_mb: {type: integer, minimum: 16, maximum: 65536, default: 256}
        cpus: {type: number, exclusiveMinimum: 0, maximum: 128, default: 1.0}
        bundle: {oneOf: [{$ref: '#/components/schemas/Bundle'}, {type: 'null'}], default: null}
        runtime_profile:
          description: 管理员配置名称，非空引用须同时提供 bundle
          oneOf: [{$ref: '#/components/schemas/Name'}, {type: 'null'}]
          default: null
    Resource:
      type: object
      required: [generation, data_generation]
      properties:
        generation: {type: integer, minimum: 1}
        data_generation: {type: integer, minimum: 1}
    Operation:
      oneOf:
        - type: 'null'
        - type: object
          required: [kind]
          properties: {kind: {enum: [create, start, stop, delete]}}
        - type: object
          required: [kind, previous, preserve_data]
          properties:
            kind: {const: rebuild}
            previous: {$ref: '#/components/schemas/Resource'}
            preserve_data: {type: boolean}
    Endpoint:
      type: object
      required: [name, port, visibility, address]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        port: {$ref: '#/components/schemas/Port'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        address: {type: string, minLength: 1}
    Sandbox:
      type: object
      required: [id, spec, resource, retired, revision, status, operation, endpoints, error]
      properties:
        id: {$ref: '#/components/schemas/Name'}
        spec: {$ref: '#/components/schemas/SandboxSpec'}
        resource: {$ref: '#/components/schemas/Resource'}
        retired: {type: array, items: {$ref: '#/components/schemas/Resource'}}
        revision: {type: integer, minimum: 0}
        status: {enum: [preparing, running, stopped, deleting, error]}
        operation: {$ref: '#/components/schemas/Operation'}
        endpoints: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}
        error: {type: [string, 'null']}
