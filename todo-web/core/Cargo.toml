[package]
name = "todo-core"
description = "SUMM-Todo 任务与项目实体及状态机"
version = "0.3.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
