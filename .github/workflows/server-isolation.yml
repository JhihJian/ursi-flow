name: Workspace isolation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: server
            sources: |
              /Cargo.toml
              /Cargo.lock
              /server/
              /flow-runtime/client/Cargo.toml
              /flow-runtime/client/Cargo.lock
              /flow-runtime/client/src/
              /flow-runtime/package*.json
              /flow-runtime/tsconfig*.json
              /flow-runtime/src/
          - side: sandbox
            sources: |
              /ursi-sandbox/
              /contracts/gateway/v1/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
            /.cargo/
            /rust-toolchain
            /rust-toolchain.toml
            ${{ matrix.sources }}
      - uses: actions/setup-node@v4
        if: matrix.side == 'server'
        with:
          node-version: '24'
      - name: Build and test isolated workspace
        run: scripts/ci/run-workspace-isolation.sh "${{ matrix.side }}"
        env:
          CI_REPORT_DIR: ${{ runner.temp }}/isolation-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-${{ matrix.side }}
          path: ${{ runner.temp }}/isolation-report/
