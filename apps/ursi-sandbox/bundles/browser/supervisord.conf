[program:ide]
command=%(ENV_URSI_RUNTIME_DIR)s/bin/ide-start.sh
user=agent
environment=HOME="/home/agent",USER="agent"
priority=25
startsecs=3
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-stack]
command=%(ENV_URSI_RUNTIME_DIR)s/bin/browser-start.sh
user=agent
environment=HOME="/home/agent",USER="agent",URSI_BROWSER_RUN_DIR="/run/ursi/agent/browser"
priority=30
startsecs=3
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
