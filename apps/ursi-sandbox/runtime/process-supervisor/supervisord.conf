[unix_http_server]
file=/run/ursi/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/ursi/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
childlogdir=/run/ursi
minfds=256
minprocs=100

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/ursi/supervisor.sock

[eventlistener:recovery]
command=/usr/bin/python3 %(ENV_URSI_RUNTIME_DIR)s/supervisor/recovery.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL,TICK_5
buffer_size=128
priority=1
startsecs=1
startretries=3
autorestart=unexpected
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
startsecs=0
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
