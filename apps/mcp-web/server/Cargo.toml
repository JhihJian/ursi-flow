[package]
name = "mcp-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-streamable-http-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-stream = "0.2.6"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
