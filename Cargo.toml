[workspace]
resolver = "2"
default-members = [
    "server",
    "server/crates/domain",
    "server/crates/agent-runtime",
]
members = [
    "server",
    "server/crates/domain",
    "server/crates/agent-runtime",
    "server/crates/agent-cli-adapter",
    "server/crates/channel",
    "server/crates/mcp-server",
    "server/crates/sandbox-observe",
    "sandbox-gateway/gateway",
    "sandbox-gateway/runtime/bundle/session-service",
    "sandbox-gateway/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "io-util", "signal"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# 内部 crate
ursi-domain = { path = "server/crates/domain" }
ursi-agent-runtime = { path = "server/crates/agent-runtime" }
ursi-agent-cli-adapter = { path = "server/crates/agent-cli-adapter" }
ursi-channel = { path = "server/crates/channel" }
ursi-mcp-server = { path = "server/crates/mcp-server" }
ursi-sandbox-observe = { path = "server/crates/sandbox-observe" }
