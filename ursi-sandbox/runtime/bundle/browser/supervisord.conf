[program:ide]
command=%(ENV_URSI_RUNTIME_DIR)s/bin/ide-start.sh
priority=25
startsecs=3
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-stack]
command=%(ENV_URSI_RUNTIME_DIR)s/bin/browser-start.sh
priority=30
startsecs=3
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
