<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络观测 · 沙箱控制台交互原型</title>
<style>
:root{color-scheme:light;--bg:#fafbf9;--ink:#19241f;--muted:#52645b;--line:#d6dfd9;--accent:#087252;--surface:white}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}header,main{max-width:1080px;margin:auto;padding:16px 28px}header,.bar,.heading,.charthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid var(--line)}strong,h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:18px}main{padding-top:27px}.meta,small,label{color:var(--muted)}select,button{font:inherit;color:inherit;background:var(--surface);border:1px solid #acbbb1;border-radius:5px;padding:6px 12px}button{cursor:pointer}button:disabled{cursor:default;opacity:.65}button:not(:disabled):hover,select:hover{border-color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0;padding:15px 0;border-block:1px solid var(--line);gap:14px}.stats div{display:grid}.stats b{font:600 24px ui-monospace,monospace}.section{margin-top:22px}.notice{padding:10px 14px;background:#eef2ee;border-left:3px solid #75897b;margin-top:12px}.warn{background:#fff4d8;color:#614610;border-color:#bd830c}.tag{color:var(--accent);font-weight:650}.plot{height:122px;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:3px;background:repeating-linear-gradient(to top,transparent 0,transparent 39px,var(--line) 40px)}.plot i{flex:1;background:#218263}.ticks{display:flex;justify-content:space-between;color:var(--muted);font:12px ui-monospace,monospace;padding-top:6px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font:14px/1.5 ui-monospace,monospace;text-align:left}td,th{padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.selected{background:#e4f1e9}td button{padding:2px 8px}.detail{min-height:54px;margin-top:14px;border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:650px){header,main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.charthead{align-items:start}.heading{align-items:start}h1{font-size:22px}}
</style></head><body>
<header><strong>URSI　/　沙箱控制台</strong><label>交互原型 · 示例场景 <select id="scene"><option value="live">采集中</option><option value="done">已结束</option><option value="crash">异常中断</option><option value="offline">服务离线</option></select></label></header>
<main><p class="meta">沙箱详情　/　demo-a　/　网络观测</p><div class="heading"><div><h1>网络流量观测</h1><small>容器代际 3　·　观测 2f95c7b1…　·　14:32:00 开始</small></div><div class="bar"><span class="tag" id="state" role="status"></span><button id="stop">停止观测</button></div></div>
<div class="notice" id="message"></div><div class="stats"><div><small>已写入报文</small><b id="packets"></b></div><div><small>PCAP 大小</small><b id="bytes"></b></div><div><small>内核丢包</small><b>0</b></div><div><small>队列丢包</small><b>0</b></div></div>
<section id="chart"><div class="charthead"><h2>PCAP 写入速率</h2><small>KiB/s · 最近 60 秒 · 峰值 28</small></div><div class="plot" role="img" aria-label="示例趋势：最近一分钟写入速率在 4 到 28 KiB/s 之间"></div><div class="ticks"><span>14:32:00</span><span>14:32:30</span><span>14:33:00</span></div></section>
<section class="section"><div class="charthead"><h2>报文明细</h2><small id="scope"></small></div><div id="locked" class="notice">采集尚未收尾，分段暂不可读。</div><div id="replay"><div class="bar"><p>分段 1 / 1　·　SLL2</p><label>显示方向 <select id="direction"><option value="all">全部</option><option>发出</option><option>本机接收</option></select></label></div><div class="scroll"><table><thead><tr><th>序号</th><th>时间</th><th>接口索引</th><th>包类型</th><th>源 → 目的</th><th>协议</th></tr></thead><tbody id="rows"></tbody></table></div><p id="detail" class="detail" aria-live="polite"></p></div></section></main>
<script>
const $=s=>document.querySelector(s),scene=$('#scene'),stopButton=$('#stop'),direction=$('#direction');let timer;
const samples=[8,9,11,10,14,23,20,8,6,4,8,11,16,23,28,22,17,12,10,15,18,20,24,22,16,12,12,9,7,9];for(const n of samples){const b=document.createElement('i');b.style.height=(n/30*100)+'%';$('.plot').append(b)}
const records=[['14:32:01.004','1','发出','127.0.0.1:54102 → 127.0.0.1:8080','TCP',76],['14:32:01.004','1','本机接收','127.0.0.1:54102 → 127.0.0.1:8080','TCP',76],['14:32:01.117','2','发出','192.0.2.2:54008 → 192.0.2.8:443','TCP',104],['14:32:01.134','2','本机接收','192.0.2.8:443 → 192.0.2.2:54008','TCP',128]];
function table(){const rows=$('#rows');rows.replaceChildren();let first;records.forEach(([t,i,d,a,p,len],k)=>{if(direction.value!=='all'&&d!==direction.value)return;const r=rows.insertRow(),button=document.createElement('button');button.textContent='#'+(k+1);r.insertCell().append(button);for(const v of [t,i,d,a,p])r.insertCell().textContent=v;button.onclick=()=>{for(const tr of rows.rows)tr.classList.toggle('selected',tr===r);$('#detail').textContent=`记录 #${k+1}　·　SLL2 接口索引 ${i}　·　${d}　·　捕获长度 ${len} B　·　原始长度 ${len} B`};first??=button});first?.click()}
function render(){clearTimeout(timer);const s=scene.value,end=s==='done'||s==='crash';$('#state').textContent={live:'采集中',done:'已停止',crash:'已中断',offline:'状态未知'}[s];stopButton.hidden=s!=='live';stopButton.disabled=false;$('#chart').hidden=s!=='live';$('#locked').hidden=end;$('#replay').hidden=!end;$('#scope').textContent=end?'分段预览 · 前 4 条示例记录':'';$('#message').classList.toggle('warn',s==='crash'||s==='offline');$('#message').textContent={live:'采集范围：目标命名空间全部接口，含回环。',done:'已按请求停止，1 个 PCAP 分段可读取。',crash:'Observer 中断。计数是最后一次快照，末段可能不完整。',offline:'Observer 暂不可达。保留 14:33:00 的快照，当前是否仍在采集未知。'}[s];$('#locked').textContent=s==='offline'?'服务恢复后重新查询观测状态。':'采集尚未收尾，分段暂不可读。';$('#packets').textContent='2,816';$('#bytes').textContent='840 KiB';table()}
scene.onchange=render;direction.onchange=table;stopButton.onclick=()=>{stopButton.disabled=true;$('#state').textContent='正在收尾';$('#message').textContent='停止请求已受理，等待最终状态。';timer=setTimeout(()=>{scene.value='done';render()},900)};render();
</script></body></html>
