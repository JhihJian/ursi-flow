[program:session-service]
command=%(ENV_URSI_RUNTIME_DIR)s/bin/ursi-session-service
environment=URSI_SESSION_BIND="0.0.0.0:8765",URSI_SESSION_CONFIG_DIR="/run/ursi/config",URSI_WORKSPACE_ROOT="/ursi/workspace",URSI_SESSION_STATE_DIR="/ursi/workspace/.ursi-state",URSI_PI_BIN="/usr/local/bin/pi"
priority=20
startsecs=0
startretries=0
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
